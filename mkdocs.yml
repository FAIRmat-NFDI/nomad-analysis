site_name: NOMAD Analysis Plugin Documentation
site_description: |
  Documentation for the NOMAD Analysis plugin - Tools for data analysis within NOMAD
site_author: The NOMAD Authors
repo_url: https://github.com/FAIRmat-NFDI/nomad-analysis
edit_uri: ""

nav:
  - Home: index.md
  - Tutorial: tutorial/tutorial.md
  - How-to guides:
      - Install and add to your Oasis: how_to/install_and_add_to_your_oasis.md
      - Analysis with Jupyter Notebooks: how_to/analysis_with_jupyter_notebooks.md
      - Extend JupyterAnalysis Schema: how_to/extend_jupyter_analysis.md
      - Run NOMAD Actions from ELN: how_to/run_nomad_actions_from_eln.md
      - Contribute to the Plugin: how_to/contribute_to_the_plugin.md
  - Explanation: explanation/explanation.md
  - References:
      - Overview: reference/references.md
      - Entry Points: reference/entry_points.md
      - Schemas:
          - General: reference/schemas/general.md
          - Jupyter Analysis: reference/schemas/jupyter.md
          - Actions: reference/schemas/actions.md
plugins:
 - search
 - macros:
    module_name: docs/main
theme:
  name: material
  palette:
    primary: "#2A4CDF"
    accent: "#008A67"
  font:
    text: "Titillium Web"
  logo: assets/nomad-plugin-logo.png
  favicon: assets/favicon.png
  features:
    - navigation.instant
  custom_dir: docs/theme
  icon:
    repo: fontawesome/brands/github
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: True
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - mkdocs-click
  - pymdownx.extra
extra:
  generator: false
  homepage: https://nomad-lab.eu
use_directory_urls: false
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
